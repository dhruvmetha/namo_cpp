# NAMO Configuration for diff-drive car robot
# Use with scaled-down environments from scale_environment.py

planning:
  high_level_resolution: 0.05
  skill_level_resolution: 0.005   # Finer grid for smaller robot
  robot_size: [0.04, 0.04]        # Half of 7.6cm car width
  robot_type: "diff_drive"

skill:
  max_push_steps: 10
  max_mpc_iterations: 1
  control_steps_per_push: 250
  force_scaling: 1.0
  goal_tolerance: 0.03            # Tighter tolerance for small robot
  check_object_collision: false     # Disabled — region_opening sets this dynamically
  stuck_check_stride: 80           # Car needs time to cross gap to object
  controller_stuck_threshold: 5    # More lenient — car pushes intermittently
  controller_min_position_change: 0.0003
  controller_min_angle_change: 0.05
  object_clearance: 0.03
  points_per_face: 15

system:
  motion_primitives_file: "data/car_motion_primitives_15.dat"
  enable_visualization: false
