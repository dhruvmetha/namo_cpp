# NAMO Configuration for diff-drive car robot
# Use with scaled-down environments from scale_environment.py

planning:
  high_level_resolution: 0.05
  skill_level_resolution: 0.005   # Finer grid for smaller robot
  robot_size: [0.052, 0.052]      # Diagonal half-reach of the 7x7.6cm car (sqrt(3.5^2 + 3.8^2) ≈ 5.17cm) — covers corner extent so diagonal pinch points are correctly marked occupied.
  robot_type: "diff_drive"
  wavefront_edge_offset_margin: 0.03  # Unified robot-edge spawn margin beyond robot radius

skill:
  max_push_steps: 10
  # Match primitive generator: one push step = 250 sim steps (0.5s).
  # apply_control runs 5 sim steps per ctrl call (0.01s / 0.002s tick) → 50 ctrl × 5 = 250 sim steps.
  control_steps_per_push: 50
  # Linear push speed in m/s. With push_tracker_max_speed = 0.3 (the
  # follower fraction), the wheel command is 0.3 × 0.2 / wheel_radius.
  push_velocity: 0.2
  goal_tolerance: 0.03            # Tighter tolerance for small robot
  check_object_collision: false     # Disabled — region_opening sets this dynamically
  stuck_check_stride: 80           # Car needs time to cross gap to object
  controller_stuck_threshold: 5    # More lenient — car pushes intermittently
  controller_min_position_change: 0.0003
  controller_min_angle_change: 0.05
  points_per_face: 15

system:
  motion_primitives_file: "data/car_motion_primitives_15.dat"
  enable_visualization: false   # set true to pop a GLFW window during runs (needs X display)
