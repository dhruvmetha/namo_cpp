# Measurement options, separate from the behavior-affecting search protocol.
measurement:
  schema_version: 1
  record_statistics: true
  record_timing: false

# Explicit new-campaign values; historical campaign defaults are not changed.
protocol:
  one_keyhole_call_cap: 3000
  full_namo_call_cap: 9000
  hmax: 2
  random_seeds: [7000, 8000, 9000, 10000, 11000]
  one_keyhole_expected_trials_cutoffs: [3, 15]
  full_namo_median_call_cutoffs: [30, 300]
