# Complete NAMO Configuration
# This file contains all configurable parameters for the NAMO system

# High-level planning configuration
planning:
  # Grid resolutions for different planning levels
  high_level_resolution: 0.05    # 2cm grid for reachability analysis
  skill_level_resolution: 0.02    # 2cm grid for detailed skill planning
  
  # Planning limits
  max_iterations: 10               # Maximum high-level planning iterations  
  verbose: true                    # Enable verbose planning output
  
  # Robot physical properties
  # Inflation half-extent per axis, in XML-scale units (scale_factor=6 vs real cm).
  # Value = axis-aligned half-extent of 7×7 cm robot footprint = 3.5 cm,
  # scaled to XML units: 3.5 * 6 / 100 = 0.21. The wavefront helper applies
  # rotation-safe (diagonal) inflation on top → effective inflation ≈ 4.95 cm real.
  # Must stay in sync with robot_control real.yaml (width_cm=7, height_cm=7).
  robot_size: [0.21, 0.21]          # 7×7 robot, 3.5 cm half-extent per axis
  wavefront_edge_offset_margin: 0.033  # 0.55 cm — push offset past inflated boundary (one wavefront cell)

  # Grid system limits
  max_bfs_queue: 100000            # Maximum BFS queue size
  max_grid_width: 2000             # Maximum grid width in cells
  max_grid_height: 2000            # Maximum grid height in cells
  max_changes: 10000               # Maximum tracked grid changes
  
  # Motion detection thresholds
  position_threshold: 0.0001       # 0.1mm - minimum position change to detect
  rotation_threshold: 0.001        # ~0.06 degrees - minimum rotation change
  small_rotation_limit: 0.05       # ~3 degrees - threshold for small rotations

# Selection strategy configuration
strategy:
  # Random strategy parameters
  random:
    min_goal_distance: 0.3         # Minimum distance from object to goal (meters)
    max_goal_distance: 1.0         # Maximum distance from object to goal (meters)
    max_goal_attempts: 100         # Maximum polar coordinate sampling attempts
    max_object_retries: 100        # Maximum object selection retries
  
  # ML/Diffusion strategy parameters
  ml:
    zmq_endpoint: "tcp://localhost:5555"  # ZMQ endpoint for ML communication
    timeout_ms: 1000               # ZMQ communication timeout
    fallback_to_random: true       # Use random strategy if ML fails

# Skill execution configuration
skill:
  # Push skill parameters
  max_push_steps: 10               # Maximum push steps per skill execution
  control_steps_per_push: 250      # Control simulation steps per push step

  # ── Velocity-actuator control ─────────────────────────────────────────
  # When XML actuators are <velocity> (see data/*.xml), the controller's
  # ctrl values are interpreted as desired velocity in m/s (sim units).
  # push_velocity becomes the magnitude of the velocity command vector.
  #
  # Tuned for the SKILL path (push primitive executor → controller). The
  # executor runs the navigation phase before the push, with stuck detection
  # comparing object position every stuck_check_stride=20 ticks. At slower
  # velocities (≤0.10 m/s), object motion per 20 ticks falls below the
  # controller stuck threshold and the controller aborts. 0.30 m/s gives the
  # object enough motion-per-tick to clear the stuck threshold reliably
  # across all 60 edges on all 3 prim-gen shapes (per
  # test_primitive_generation_integration.py).
  # Real-equivalent at scale 6: 0.30 / 6 = 5 cm/s, matching typical
  # micro-MVP-class robot speeds.
  push_velocity: 0.30              # m/s — commanded robot velocity during push

  # When true, the controller re-derives push direction from the current
  # object pose every control tick (robot traces an arc as object yaws).
  # When false, push direction is fixed at primitive start (robot drives
  # straight in world frame; matches real-side push.py default). See
  # real_push_pure_pursuit_vs_simplification.md for the design discussion.
  dynamic_direction: true          # true=track object yaw, false=fixed direction

  # Execution parameters
  goal_tolerance: 0.1              # Goal reaching tolerance (meters)
  check_robot_trajectory_collision: false  # Terminate push if robot body hits walls/objects during push trajectory. Set false to allow such pushes (e.g., when planning aggressively or debugging)
  # Controller-level stuck detection (push controller)
  stuck_check_stride: 30           # Control steps between stuck checks
  controller_stuck_threshold: 3    # Checks before aborting due to stuck
  controller_min_position_change: 0.001  # Min movement per check (meters)
  controller_min_angle_change: 0.05      # Min yaw change per check (radians)
  
  # Object interaction parameters
  # Edge sampling count for push approach generation
  points_per_face: 15               # Number of edge points per object face (4 faces total)
  num_edge_points: 60              # Number of edge points around object perimeter (backward compatibility)

# Environment configuration
environment:
  # Workspace bounds - now derived dynamically from MuJoCo XML
  # bounds: [-5.525, 5.525, -5.525, 5.525]  # REMOVED: now calculated from environment
  
  # Memory allocation limits
  max_static_objects: 30           # Maximum number of static objects
  max_movable_objects: 30          # Maximum number of movable objects
  max_actions: 100                 # Maximum action sequence length
  max_motion_primitives: 1000      # Maximum motion primitives in memory
  max_planning_nodes: 10000        # Maximum search nodes
  
  # Logging configuration
  log_buffer_size: 100000          # Log buffer size (bytes)
  enable_logging: false            # Enable state logging
  log_directory: "logs/"           # Directory for log files

# System configuration
system:
  # Performance options
  enable_visualization: false       # Enable MuJoCo visualization
  enable_profiling: false          # Enable performance profiling
  num_threads: 1                   # Number of threads for parallel processing
  
  # File paths
  # Base PREFIX for the motion primitive database. The skill loads three
  # shape-specific files derived from this prefix:
  #   data/motion_primitives_15_square.dat
  #   data/motion_primitives_15_wide.dat
  #   data/motion_primitives_15_tall.dat
  # The literal path here does NOT need to exist as a file — it's only
  # used to derive the suffixed siblings.
  motion_primitives_file: "data/motion_primitives_15.dat"
  default_scene_file: "/common/home/dm1487/robotics_research/ktamp/ml4kp_ktamp/resources/models/custom_walled_envs/aug9/easy/set1/benchmark_1/env_config_7b.xml"         # Default MuJoCo scene
  
  # Data collection
  collect_training_data: false     # Enable training data collection
  training_data_directory: "training_data/"  # Directory for training data


# Motion primitive configuration
motion_primitives:
  # Generation parameters (for regenerating primitives) 
  max_push_steps: 10               # Maximum steps per primitive
