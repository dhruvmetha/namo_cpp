# Car v2 controller: namo_config_complete_skill15_car_1x.yaml plus the skill.car_* keys below,
# which swap car v1's controller for ports of the real robot's (robot_control):
#   - Between pushes the car drives to the push start under the ported NavigationController
#     (rotate, pure pursuit along the wavefront path, rotate) instead of teleporting.
#   - The push runs the ported FollowPathController (pure pursuit + CTE-PD + ALIGN) at the
#     hardware push cap 0.4 and the hardware 30 Hz command rate.
#   - Wheel commands go to ctrl as normalized PWM in [-1, 1], for car v2's DC-motor actuator.
#     The v1 car XML has velocity actuators, where ctrl is rad/s, so pair this config with the
#     car v2 XML. To drive v1's car with these controllers, set car_actuation: "wheel_velocity".
#
# Values in the navigation: and push: blocks come from robot_control config/controller.yaml (the
# runtime values, not the dataclass fallbacks in controller/config.py); each line names its
# source line. Everything outside the car v2 block is unchanged from the v1 car config.
#
# What of robot_control's push.py this mirrors:
#   - approach skip when already within 1 cm and 30 deg of the push start (push.py:381-388);
#   - drive to the push start with goal heading = push heading (push.py:438-445);
#   - push path actual_pos -> shifted mid -> 50 cm on, set once (dynamic_direction false) and
#     tracked by FollowPathController at push.max_speed, lookahead 1.0 and goal tolerance
#     0.3 x car_size (push.py:203-209, 553-617).
# What it does not:
#   - approach validation that slides a blocked edge point up to 5 cm along the push line
#     (push.py:980-1035); NAMO edge points are wavefront-reachable and get a placement check;
#   - push.py going on to push after a FAILED navigation (is_done counts FAILED, push.py:489);
#     here a failed drive fails the push;
#   - push.push_steps x 30 Hz tick budget, the post-push 2 cm / 5 deg stuck rule and the safety
#     filter; NAMO keeps control_steps_per_push and its own stuck detector and collision aborts;
#   - RETREATING after the push (push.py:794-871) is ported but off (car_push_retreat). Without
#     it the next drive starts from the contact pose.
#
# The primitive table below is still car v1's. Its predicted displacements were generated under
# v1's teleport + PushPathFollower, so regenerate it under this config before planning with it.

# High-level planning configuration
planning:
  # Grid resolutions for different planning levels
  high_level_resolution: 0.01     # 1cm grid for reachability analysis
  skill_level_resolution: 0.005    # 5mm grid for detailed skill planning

  # Planning limits
  max_iterations: 10               # Maximum high-level planning iterations
  verbose: true                    # Enable verbose planning output

  # Robot type: routes NAMOEnvironment to the diff-drive adapter
  # (src/environment/namo_environment.cpp:91-109).
  robot_type: "diff_drive"

  # Robot physical properties — REAL-WORLD CM.
  # Half-extent of 7×7 cm car chassis = 3.5 cm = 0.035 m. Matches sphere.
  # Must stay in sync with robot_control real.yaml (width_cm=7, height_cm=7).
  robot_size: [0.035, 0.035]       # 7×7 robot, 3.5 cm half-extent per axis
  wavefront_edge_offset_margin: 0.01    # 1 cm — push offset past inflated boundary. Needs
                                        # to exceed tier1_inflation_margin (0.005 m) plus half
                                        # the wavefront cell size (0.002/2 m) so edge-point
                                        # cells land cleanly outside the inflated obstacle.
  robot_goal: [0.052, -0.733]      # Placeholder — overridden at runtime

  # Grid system limits
  max_bfs_queue: 100000            # Maximum BFS queue size
  max_grid_width: 2000             # Maximum grid width in cells
  max_grid_height: 2000            # Maximum grid height in cells
  max_changes: 10000               # Maximum tracked grid changes

  # Motion detection thresholds
  position_threshold: 0.00002      # ~20 µm minimum position change
  rotation_threshold: 0.001        # ~0.06 deg minimum rotation change (radians)
  small_rotation_limit: 0.05       # ~3 deg threshold for small rotations (radians)

# Selection strategy configuration
strategy:
  # Random strategy parameters
  random:
    min_goal_distance: 0.05        # 5 cm minimum
    max_goal_distance: 0.17        # 17 cm maximum
    max_goal_attempts: 100
    max_object_retries: 100

  # ML/Diffusion strategy parameters
  ml:
    zmq_endpoint: "tcp://localhost:5555"
    timeout_ms: 1000
    fallback_to_random: true

# Skill execution configuration
skill:
  # Push skill parameters
  max_push_steps: 5                # d5: action depths 0-4
  control_steps_per_push: 550

  # Velocity-actuator control.
  # 0.05 m/s = 5 cm/s. For the diff-drive car this becomes a wheel
  # command of push_velocity / wheel_radius = 0.05 / 0.015 ≈ 3.33 rad/s,
  # well within little_car.xml's wheel ctrlrange ±25 rad/s.
  push_velocity: 0.2               # m/s — holonomic-only knob; ignored by diff-drive car (which uses push_tracker_max_speed below)
  dynamic_direction: false         # false = fix push direction at primitive-start, drive
                                   # straight in world frame for push_steps×control_steps_per_push
                                   # ticks. Path A relies on this.

  # Diff-drive push fraction cap. Calibrated 2026-05-22 via closed-loop
  # PP at PWM 0.4 on the real robot (robot_control/scripts/collect_pp_trial_real.py
  # + find_sim_fraction.py). Real median cruise = 5.125 cm/s ± 0.010; sim
  # at fraction 0.05381 cruises at 5.123 cm/s (binary-search 8 iter,
  # ε = 1×SE_real). Same value as in config/namo_config_car.yaml — keep
  # in sync. Without this line the C++ side falls back to ConfigManager's
  # default of 0.3, which makes sim ~5.6× faster than real.
  # Session: chassis_calibration/20260523_002800_pp_session/sim/search_result.json
  push_tracker_max_speed: 0.4      # v2: controller.yaml:42 push.max_speed, normalized PWM cap.
                                   # (v1 0.05357 was the sim m/s fraction matched to it.)

  # Execution parameters
  goal_tolerance: 0.02             # 2 cm goal reaching tolerance
  check_robot_trajectory_collision: true  # Reject a push when the robot body hits a wall or a non-target object (always on, Dhruv 2026-09-14)
  stuck_check_stride: 150          # Sphere uses 30 ticks at 0.01 s = 0.3 s; match at car's 0.002 s timestep (150 × 0.002 = 0.3 s). Required so the stuck check doesn't fire before the car traverses the 1 cm standoff gap (~0.2 s at 0.05 m/s).
  controller_stuck_threshold: 5  # Restored for production horizon-Q collection (was 1000000 experimental; e198b47 flagged "revert before production"). The auto-abort safety net is needed for multi-push data collection.
  controller_min_position_change: 0.0002  # 0.2 mm min motion per check
  controller_min_angle_change: 0.05      # ~3 deg min yaw change per check (radians)

  # Edge sampling for push approach
  points_per_face: 15              # Number of edge points per object face
  num_edge_points: 60              # = 4 × points_per_face

  # ── Car v2 controller ─────────────────────────────────────────────────────
  # Each key's default (absent) reproduces car v1 exactly.
  car_controller_hz: 30.0          # real.yaml:56 serial.send_hz. Controller runs on sim time and
                                   # holds its command between updates (v1: 0 = every 2 ms tick).
  car_nav_mode: "drive"            # navigation.py NavigationController (v1: "teleport").
  car_actuation: "normalized"      # ctrl = PWM command in [-1, 1] (v1: "wheel_velocity").
  car_command_deadzone: 0.0        # normalized only: |u| below this -> 0. Real drivetrain dead
                                   # zone is ~0.3; left at 0 until the drivetrain fit sets it.
  car_push_follower: "follow_path" # follow_path.py FollowPathController, with ALIGN (v1: "v1").
  car_nav_max_time_s: 120.0        # sim-time cap per drive; navigation_baseline_sim.py:31
                                   # DEFAULT_MAX_SIM_TIME_S.
  car_nav_path_planner: "proximity_dijkstra"  # controller.yaml:17 planner "wavefront" =
                                   # wavefront_path_planner.py: proximity cost, Dijkstra, gradient
                                   # descent, on NAMO's inflated grid (v1 / default: "bfs").
  car_push_retreat: false          # push.py:794 RETREATING after each push. Off for now; the
                                   # retreat values below are what it uses when on.
  # car_command_delay_s (default 0): camera-to-motor lag; the replay fit is 0.15-0.2 s.
  navigation:
    max_speed: 0.4                 # controller.yaml:6
    pre_rotation_skip_angle: 45.0  # controller.yaml:7, degrees
    goal_tolerance_ratio: 0.15     # controller.yaml:16, x car_size (7 cm -> 1.05 cm)
    rotation_tolerance_deg: 4.0    # controller.yaml:29
    rotation_stable_time: 0.5      # controller.yaml:30, seconds (sim time here)
    rotation_speed_max: 0.25       # controller.yaml:31
    rotation_speed_min: 0.15       # controller.yaml:32
    wheel_deadband: 0.05           # controller.yaml:33, nav rotation commands only
    obstacle_proximity_distance_m: 0.02  # controller.yaml:19, 2.0 cm
    obstacle_proximity_weight: 5.0       # controller.yaml:20
  push:
    lookahead_ratio: 1.0           # controller.yaml:51, x car_size
    approach_skip_distance_m: 0.01 # controller.yaml:59 approach_skip_distance 1.0 cm
    approach_skip_angle: 30.0      # controller.yaml:60, degrees
    retreat_speed: 0.15            # controller.yaml:71
    retreat_steps: 100             # controller.yaml:72, controller updates (blind reverse;
                                   # twice this ends a targeted retreat)
    retreat_min_dist_m: 0.05       # controller.yaml:73, 5.0 cm
    retreat_max_dist_m: 0.15       # controller.yaml:74, 15.0 cm
    retreat_cone_angle: 20.0       # not in controller.yaml: controller/config.py:64 fallback
    retreat_tolerance_m: 0.02      # not in controller.yaml: config.py:67 fallback, 2.0 cm
    retreat_steer_gain: 0.3        # not in controller.yaml: config.py:68 fallback
  # controller.yaml:56 push.dynamic_direction false is skill.dynamic_direction above.
  # controller.yaml:55 push.push_steps 30 (ticks per push step at 30 Hz = 1.0 s) is NOT used:
  # a push step stays control_steps_per_push 550 ticks = 1.1 s, NAMO's push-depth meaning.

# Environment configuration
environment:
  max_static_objects: 30
  max_movable_objects: 30
  max_actions: 100
  max_motion_primitives: 1000
  max_planning_nodes: 10000
  log_buffer_size: 100000
  enable_logging: false
  log_directory: "logs/"

# System configuration
system:
  enable_visualization: false
  enable_profiling: false
  num_threads: 1

  # File paths — generator emits three shape-specific files derived from
  # this prefix:
  #   data/1x_car_d5_motion_primitives_15_square.dat
  #   data/1x_car_d5_motion_primitives_15_wide.dat
  #   data/1x_car_d5_motion_primitives_15_tall.dat
  motion_primitives_file: "data/1x_car_d5_motion_primitives_15.dat"
  default_scene_file: ""           # Set at runtime by the bridge

  collect_training_data: false
  training_data_directory: "training_data/"

# Wavefront planner specific configuration
wavefront_planner:
  resolution: 0.002                # 2mm grid for reachability checks
  robot_inflation: 0.0083          # Dead config — read by no code path

  max_distance: 1000               # Maximum distance value (cell count)
  diagonal_cost: 1.414             # sqrt(2)

  enable_incremental_updates: true
  cache_static_obstacles: true

  save_debug_grids: false
  debug_grid_directory: "debug_grids/"

# Motion primitive configuration
motion_primitives:
  max_push_steps: 5                # Must match the d5 action table and scorer head
