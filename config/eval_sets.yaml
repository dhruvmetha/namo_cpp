# Canonical eval / test-set pointer — THE single source of truth.
#
# All eval code resolves test-set paths from here (via `namo.eval_sets`), instead
# of hardcoding `namo_testset_v1/labels/...`. Change the test set = edit THIS file only.
# Paths are relative to $NAMO_SCRATCH (resolved per-box via namo.paths → portable).
# Documented in docs/experiments/eval_set_registry.md.

testset: namo_testset_v1

files:
  # canonical manifests (consumed by eval as --key / answer keys) and their untouched sources
  onepush_source:      datasets/namo_testset_v1/labels/onepush_episodes_canonical.json # full 1323, canonical test-room paths
  onepush_manifest:    datasets/namo_testset_v1/labels/onepush_search_eval.json    # search-eligible 1push manifest
  pure2push_source:    datasets/namo_testset_v1/labels/pure2push.json              # full 1018
  pure2push_manifest:  datasets/namo_testset_v1/labels/pure2push_search_eval.json   # search-eligible 2push eval key
  pure2push_divisions: datasets/namo_testset_v1/labels/pure2push_gt_divisions_search_eval.json # fixed exhaustive-GT setup-density tiers
  pure2push_gt_divisions_source: datasets/namo_testset_v1/labels/pure2push_gt_divisions_final35.json # full 1018-episode finalized GT tiers
  twopush_source:      datasets/namo_testset_v1/labels/twopush.json             # SOURCE (onepush/pure2push derived from this)
  # THE ONLY canonical comprehensive 2push GT artifact. Each included root was fully exhausted;
  # 1011/1013 search episodes are covered and the remaining two are explicitly unknown.
  twopush_gt_h5:       curriculum2/beast/round2/h5/testset_gt_plus35.h5

# Retained only for historical reproduction or distribution-shift diagnostics. These are not
# canonical test sets and must never replace the exhaustive-GT tiers/file above in new results.
noncanonical_files:
  pure2push_sampled_divisions: datasets/namo_testset_v1/labels/pure2push_divisions_search_eval.json
  deadbank_gt_h5:      curriculum2/beast/round2/h5/round2_eval.h5                # dead-bank exhaustive GT

# Canonical search baseline for both registered horizons and every fixed difficulty tier.
# Report the three runs as ONE baseline: mean +/- sample SD across seeds; never headline one seed.
baselines:
  random_search_hmax2:
    ranker: uniform_random
    seeds: [7000, 8000, 9000]
    report: mean_plus_sample_sd
    artifacts:
      7000: eval/postprune_hmax2/final35/agg_random_s7000.json
      8000: eval/postprune_hmax2/final35/agg_random_s8000.json
      9000: eval/postprune_hmax2/final35/agg_random_s9000.json
    search:
      hmax: 2
      sim_budget: 900
      combine: q
      confidence_discount_tau: 0.15
      dedupe_noop: true
      prune_jam_depth: true

# loader self-test assertions (namo.eval_sets validates against these)
expected_counts:
  onepush_source_episodes:     1323
  onepush_manifest_episodes:   1322
  onepush_divisions: {easy: 697, medium: 421, hard: 204}
  pure2push_manifest_episodes: 1013
  pure2push_source_episodes:   1018
  pure2push_gt_divisions_source_episodes: 1018
  twopush_source_episodes:     2341
  divisions:  {easy: 385, medium: 488, hard: 138, unknown: 2}
  sampled_divisions: {easy: 238, medium: 408, hard: 367}
  twopush_gt_h5_nodes:         68393

