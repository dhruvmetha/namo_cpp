# Canonical eval / test-set pointer — THE single source of truth.
#
# All eval code resolves test-set paths from here (via `namo.eval_sets`), instead
# of hardcoding `namo_testset_v1/labels/...`. Change the test set = edit THIS file only.
# Paths are relative to $NAMO_SCRATCH (resolved per-box via namo.paths → portable).
# Documented in docs/experiments/eval_set_registry.md.

testset: namo_testset_v2

files:
  # canonical manifests (consumed by eval as --key / answer keys) and their untouched sources.
  # testset_v2 = the 2026-08-09 exhaustive re-sweep on post-5daaed5 physics. See eval_set_registry.md.
  onepush_source:      datasets/namo_testset_v2/labels/onepush_v2.json                 # 1204, 1push-solvable under the new bar
  onepush_manifest:    datasets/namo_testset_v2/labels/onepush_v2.json                 # == source; no empirical exclusions derived yet on v2
  pure2push_source:    datasets/namo_testset_v2/labels/pure2push_all.json              # full 961
  pure2push_manifest:  datasets/namo_testset_v2/labels/pure2push_v2_search_eval.json   # 949 = source minus zero-GT-setup (3) and no-GT-root (9)
  pure2push_divisions: datasets/namo_testset_v2/labels/pure2push_gt_divisions_v2_search_eval.json # exhaustive-GT setup-density tiers over the 949
  pure2push_gt_divisions_source: datasets/namo_testset_v2/labels/pure2push_gt_divisions_v2.json   # full 1115-episode GT tiers
  twopush_source:      datasets/namo_testset_v2/labels/twopush_all.json                # SOURCE (both derived from this)
  # THE canonical comprehensive 2push GT artifact for v2: 100 re-swept shards merged.
  twopush_gt_h5:       curriculum2/beast/round2/h5/testset_gt_v2.h5

# Retained only for historical reproduction or distribution-shift diagnostics. These are not
# canonical test sets and must never replace the exhaustive-GT tiers/file above in new results.
noncanonical_files:
  pure2push_sampled_divisions: datasets/namo_testset_v1/labels/pure2push_divisions_search_eval.json
  deadbank_gt_h5:      curriculum2/beast/round2/h5/round2_eval.h5                # dead-bank exhaustive GT

# Canonical search baseline for both registered horizons and every fixed difficulty tier.
# Report the three runs as ONE baseline: mean +/- sample SD across seeds; never headline one seed.
baselines:
  random_search_hmax2:
    # STALE: these three runs were executed on the testset_v1 POPULATION. v2 is a partly different
    # set of region-opening instances (108 rooms resolved a different blocking object), so these
    # numbers are NOT a valid floor for v2 results. Re-run before quoting any v2-vs-random claim.
    status: STALE_v1_population
    population_episodes: {1push: 1322, 2push: 1012}
    ranker: uniform_random
    seeds: [7000, 8000, 9000]
    report: mean_plus_sample_sd
    artifacts:
      7000: eval/postprune_hmax2/final35/agg_random_s7000.json
      8000: eval/postprune_hmax2/final35/agg_random_s8000.json
      9000: eval/postprune_hmax2/final35/agg_random_s9000.json
    search:
      hmax: 2
      sim_budget: 900
      combine: q
      confidence_discount_tau: 0.15
      dedupe_noop: true
      prune_jam_depth: true

# loader self-test assertions (namo.eval_sets validates against these)
expected_counts:
  onepush_source_episodes:     1204
  onepush_manifest_episodes:   1204
  onepush_divisions: {easy: 611, medium: 401, hard: 192}
  pure2push_manifest_episodes: 949
  pure2push_source_episodes:   961
  pure2push_gt_divisions_source_episodes: 1115
  twopush_source_episodes:     2352
  divisions:  {easy: 366, medium: 467, hard: 116}
  sampled_divisions: {easy: 238, medium: 408, hard: 366}   # legacy v1 artifact, intentionally unchanged
  twopush_gt_h5_nodes:         66354

# v1's exclusions do NOT carry over: they were specific (xml, object, region) records on the v1
# population, and the two GT-derived classes are now applied programmatically when the v2 manifest is
# built (3 zero-GT-setup + 9 no-GT-root episodes dropped from pure2push_v2_search_eval.json).
# The remaining v1 entries were EMPIRICAL (every ranker exhausted the queue without realizing the GT
# answer) and can only be re-derived after the v2 re-eval. Until then this list is intentionally empty.
search_eval_exclusions: []
# archived for audit: the v1 records live in git history at config/eval_sets.yaml@164a42b
