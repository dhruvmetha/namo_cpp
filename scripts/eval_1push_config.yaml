# 1-Push Evaluation Configuration
# Usage: python eval_1push.py --config eval_1push_config.yaml
#
# This script supports two modes:
# 1. Single reference: difficulty categorization uses percentiles of oracle pushes
# 2. Multiple references: consistency analysis across runs, difficulty from median pushes

# Reference model(s) - determines difficulty categorization
# Can be a single reference (legacy format) or a list (multi-reference mode)
#
# For multi-reference consistency analysis (recommended):
reference:
  - name: "Search (Seed 42)"
    dir: /common/users/dm1487/namo_data/jan20/aug9_envs/1_push_test_first_solution_seed42
  - name: "Search (Seed 43)"
    dir: /common/users/dm1487/namo_data/jan20/aug9_envs/1_push_test_first_solution_seed43
  - name: "Search (Seed 44)"
    dir: /common/users/dm1487/namo_data/jan20/aug9_envs/1_push_test_first_solution_seed44
  - name: "Search (Seed 45)"
    dir: /common/users/dm1487/namo_data/jan20/aug9_envs/1_push_test_first_solution_seed45

# For single reference (legacy format):
# reference:
#   name: "Search (Oracle)"
#   dir: /common/users/dm1487/namo_data/dec25/aug9_envs/1_push_triplets_test_all_solutions

# Non-learned baselines
baselines:
  - name: "Exhaustive Primitive Search"
    dir:   /common/users/dm1487/namo_data/jan20/aug9_envs/1_push_test_first_solution/modular_data_1spring-303-desktop-08

  - name: "Geometric Heuristic"
    dir: /common/users/shared/robot_learning/dm1487/namo/eval_data/geometric_1push_results

# Learned models to compare
learned:

  - name: "Sage (Hybrid)"
    dir: /common/users/dm1487/namo_data/outputs/cropped_diffusion_crossattn_2push/2025-12-16/05-36-44/jan20/1push/results_32samples_int5_seed42_voting5_hybrid
  # Add more models here:
  # - name: "Diffusion"
  #   dir: /path/to/diffusion/results
  # - name: "Flow Matching"
  #   dir: /path/to/flow_matching/results

# Settings
settings:
  # Exclude environments with 'easy' in the name
  exclude_easy: true

  # NOTE: Difficulty is now determined by data-driven percentiles (p33/p66 of oracle pushes)
  # The old ratio-based thresholds (easy_threshold, hard_threshold) are deprecated

  # Output directory for plots
  output_dir: ./1_push_eval

  # Time-based success rate plot settings
  time_cutoff_max: 6000   # max time in ms
  time_step: 50           # step size in ms

  # Push-based success rate plot settings
  push_cutoff_max: 10     # max number of pushes
  push_step: 1            # step size for push cutoffs

  # RA@K (ReachableAttachment@K) thresholds
  # null = all ranked primitives
  ra_at_k_values: [10, 50, 100, null]

  # Success@Budget values (number of simulation-verified push evaluations)
  success_at_budget_values: [5, 10, 20]

  # Success@Time values (milliseconds)
  success_at_time_values: [1000, 3000, 6000]
