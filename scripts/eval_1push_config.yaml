# Optional settings (these are the defaults)
settings:
  # Exclude environments with 'easy' in the name
  exclude_easy: true

  # Thresholds for difficulty categorization (based on reference success ratio)
  easy_threshold: 0.75    # ratio > 0.75 = easy
  hard_threshold: 0.25    # ratio <= 0.25 = hard, else medium

  # Output directory for plots
  output_dir: ./dec25/eval_plots_crossattn

  # Time-based success rate plot settings
  time_cutoff_max: 6000   # max time in ms
  time_step: 50          # step size in ms
