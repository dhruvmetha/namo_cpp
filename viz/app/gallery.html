<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NAMO scene gallery — browse episodes by tier</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="gallery-body">
<header class="gallery-bar">
  <p class="crumb"><a href="index.html">&larr; NAMO viz</a></p>
  <!-- One bar, read left to right: which run, which episodes, how they are ordered. The paging
       arrows and the count line moved out of it (they are not filters, and wrapped into the middle
       of the row when they lived here). -->
  <div class="controls">
    <label class="control" id="eval-run-control" hidden>Eval run
      <!-- filled from eval.json's run names; hidden when eval.json is absent or has one run. Drives
           the summary strip, the eval sort/filter, and which run's replays the card can step. -->
      <select id="eval-run-select"></select>
    </label>
    <label class="control">Horizon
      <select id="horizon-select">
        <option value="1push">1push</option>
        <option value="2push">2push</option>
      </select>
    </label>
    <label class="control">Tier
      <select id="tier-select" title="Share of the reachable pushes at the root that are the RIGHT push: hard &lt;5%, medium 5-30%, easy &ge;30%. 1push counts openers, 2push counts working setups.">
        <option value="all">all tiers</option>
        <option value="hard">hard</option>
        <option value="medium">medium</option>
        <option value="easy">easy</option>
      </select>
    </label>
    <span class="control" id="eval-filter-control" hidden>
      <span class="control-cap">Outcome in this run</span>
      <!-- one button per bucket, filled with live counts on every filter pass; "model solved" and
           "model unsolved" both mean EVERY / NO model arm solved -- a room where some seeds solved
           and some did not falls in "model split", never in either of those two. -->
      <span class="checkrow" id="eval-outcome-row"></span>
    </span>
    <label class="control" id="label-chain-control" hidden
        title="Which objects the ground-truth solution pushes, against this card's own object. Every 1push card is a single push by definition, so this only separates anything at 2push. UNDERCOUNTS &quot;both objects&quot;: the sweep's finish loop stops at the first push that opens and tries objects in list order, so a same-object finish always wins the race over a cross-object one when both exist (exhaustive_hmax2.py). A &quot;both objects&quot; answer is never wrong; a &quot;card object only&quot; answer can be hiding an untried cross-object finish.">
      Label pushed
      <select id="label-chain-select"></select>
    </label>
    <label class="control" id="model-chain-control" hidden
        title="Which objects this run's model solution pushes, against this card's own object -- not the room's. A room with two cards (two object_ids) can read differently on each. A 1push card counts here too: the model is free to spend two pushes where one would do.">
      Model pushed
      <select id="model-chain-select"></select>
    </label>
    <label class="control">Order
      <select id="sort-select">
        <option value="density-asc">hardest first</option>
        <option value="density-desc">easiest first</option>
        <option value="speedup-desc">biggest speed-up (seconds)</option>
        <option value="speedup-asc">smallest speed-up (seconds)</option>
        <option value="eval-speedup-desc">biggest speed-up (sims)</option>
        <option value="eval-speedup-asc">smallest speed-up (sims)</option>
        <option value="scene">scene name</option>
      </select>
    </label>
    <label class="control">Scene or object
      <input type="search" id="text-filter" placeholder="type to filter">
    </label>
    <details class="control batch-details" id="fam-control" hidden>
      <summary id="fam-summary">batch</summary>
      <!-- filled from the families present in this dataset's scenes.json, so a new dataset needs no
           edit here; hidden when the dataset has only one batch. Closed by default: this is a lot of
           checkboxes for a control most sessions never touch. -->
      <span class="checkrow" id="fam-row"></span>
    </details>
    <label class="control checkbox"><input type="checkbox" id="starred-only"> starred only</label>
  </div>
  <div class="gallery-nav">
    <button type="button" id="prev-btn" title="Left arrow">&larr;</button>
    <span id="position" class="position mono">0 / 0</span>
    <button type="button" id="next-btn" title="Right arrow">&rarr;</button>
    <span id="summary" class="summary">loading scenes.json&hellip;</span>
    <button type="button" id="clear-stars-btn" title="Unstar every card" disabled>clear shortlist</button>
  </div>
  <!-- eval.json is optional; stays hidden when the dataset has no evaluation attached. -->
  <div id="eval-summary" class="eval-summary" hidden></div>
</header>

<main class="two-col">
  <aside class="facts-col">
    <h2 id="card-title">&mdash;</h2>
    <table class="meta-table" id="meta-table"></table>
    <!-- One block, one job: what each arm did on this room, and which of those solutions the step
         frames below are showing. The radios ARE the replay picker (label = replay/, an arm =
         replay_eval/<run>/<arm>/, built by scripts/viz/build_scene_replay.py --from-eval); an arm
         with no replay file on disk shows its numbers with the radio disabled. Sits directly above
         the stepper it drives, and both sit above the working-setup list: on an easy card that list
         runs to 130 entries and used to push the solutions off the bottom of the screen. -->
    <div class="eval-panel" id="eval-panel" hidden></div>
    <div class="steps" id="steps"></div>
    <div class="green-list" id="green-list"></div>
    <div class="facts-actions">
      <button type="button" id="star-btn" class="star-btn" title="Star this episode (S)">&#9734; star</button>
      <button type="button" id="copy-btn">copy shortlist (<span id="star-count">0</span>)</button>
      <!-- only ever filled when the POST of stars.json fails: silence means the list is on disk -->
      <span id="store-note" class="store-note"></span>
    </div>
    <p class="zone-note">
      <kbd>&larr;</kbd> <kbd>&rarr;</kbd> step through the filter, <kbd>&uarr;</kbd> <kbd>&darr;</kbd>
      walk the solution, <kbd>S</kbd> stars.
      Dots: <span class="legend-swatch dot-green"></span>&nbsp;a push that works,
      <span class="legend-swatch dot-tried"></span>&nbsp;tried and does not,
      <span class="legend-swatch dot-untried"></span>&nbsp;edge never reachable.
    </p>
    <p class="zone-note mono" id="xml-path"></p>
  </aside>

  <section class="scene-col">
    <svg id="scene-svg" class="scene-svg" preserveAspectRatio="xMidYMid meet"></svg>
    <p class="zone-note" id="scene-legend"></p>
  </section>
</main>

<script src="scene_render.js"></script>
<script src="gallery.js"></script>
</body>
</html>
