<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NAMO search viz — moved</title>
<!-- Same move as index.html in this folder, but this one carries ?arm=&key= that a meta-refresh
     cannot forward, so the redirect is done in script instead. -->
</head>
<body>
<p>This page moved to <a id="dest" href="../app/episode.html">../app/episode.html</a>.</p>
<script>
  "use strict";
  var q = new URLSearchParams(window.location.search);
  q.set("data", "../search/");
  var dest = "../app/episode.html?" + q.toString();
  document.getElementById("dest").href = dest;
  window.location.replace(dest);
</script>
</body>
</html>
