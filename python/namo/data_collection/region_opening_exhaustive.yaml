# YAML config for exhaustive F characterization
# Runs ALL reachable primitives without pruning, logs every outcome
# Use with: python modular_parallel_collection.py --config-yaml python/namo/data_collection/region_opening_exhaustive.yaml

# Core execution
output_dir: /common/users/dm1487/namo_data/f_characterization/1_push_exhaustive
algorithm: region_opening
workers: 48
episodes_per_env: 1

# Generic planner limits
max_depth: 5
max_goals_per_object: 5
max_terminal_checks: 5000
search_timeout: 600.0  # Longer timeout since we evaluate all primitives

# Region opening parameters — exhaustive mode
points_per_face: 15
region_max_chain_depth: 1              # 1-push only for initial characterization
region_max_solutions_per_neighbor: 9999  # Don't cap solutions
region_max_recorded_solutions_per_neighbor: 9999
region_frontier_beam_width: 10000
region_chain_link_cost: 11
region_ml_ignore_blacklist: false
region_selection_strategy: cost_first
region_exhaustive_mode: true           # Disable search pruning, log all primitive outcomes

# Goal strategy: pure primitive (no ML)
goal_strategy: primitive

# Paths — UPDATE THESE for your run
xml_dir: /common/users/shared/robot_learning/dm1487/namo/mj_env_configs/nov28/11_11_07deletion/maze_11x11_del70p_seed25188
config_file: config/namo_config_complete_skill15_car_1x.yaml
manifest: /common/users/shared/robot_learning/dm1487/namo/manifests/aug9_medium/manifest_test.txt

# Pipeline features — no smoothing/refinement needed for characterization
verbose: false
filter_minimum_length: false
smooth_solutions: false
refine_actions: false
validate_refinement: false
