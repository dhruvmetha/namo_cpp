# COLOSSUS top-20 capped finish collection + 20% exhaustive audit — CAR robot.
# Every post-push board follows d20 order. Non-audit episodes stop after 20 failed finishes and mark the
# unresolved setup CENSORED/UNKNOWN. A stable seed-42 20% sample of complete object episodes instead uses
# exhaust-on-top-20-miss, recovering buried finishers and measuring the cap's false-negative rate.
# Retained roots (no direct opener) exhaust depth-1 before entering depth 2. The mixed-policy knobs take
# precedence over the disabled legacy global caps. trial_log score+rank is kept for the H5 build.
# Colossus rejection mode: root pushes follow d20 score order. A verified root opener immediately
# rejects that object episode and skips every post-push finish sweep; only roots with no opener after
# the complete reachable root sweep enter depth 2. The rejected root keeps a minimal audit record.
# RUN WITH `--target-goal-region` (CLI store_true; goal-opening only). Scorer (beast-1-clean = the soft
# champion of the clean line) overridable with --scorer-ckpt; device with --ml-device (cpu on Amarel).

algorithm: region_opening
episodes_per_env: 1

# Generic planner limits
max_depth: 5
max_goals_per_object: 5
max_terminal_checks: 5000
search_timeout: 600.0
# Enforced per-neighbour time budget (checked between candidate objects in _attempt_opening_to_neighbour);
# bounds the depth-2 exhaustive-on-miss cost so a pathological rich scene can't hog a worker. 480s (already
# committed for round-2); unfinished setups are MASKED, never mislabelled.
region_timeout_per_neighbour_sec: 480.0
goals_per_region: 50
region_min_reachable_fraction: 0.2

# Region opening parameters
points_per_face: 15
region_allow_collisions: true
region_max_chain_depth: 2
region_max_solutions_per_neighbor: 1
region_max_recorded_solutions_per_neighbor: 1
region_frontier_beam_width: 10000
region_chain_link_cost: 11
region_ml_ignore_blacklist: false
region_selection_strategy: ml_first

# --- LABEL block ---
region_label_mode: true
region_exhaustive_mode: true
region_stop_after_root_opener: true
region_record_action_motion: true
# Same-object two-push setup must create a new object pose; do not expand slips/no-ops at depth 2.
region_prune_noop_setups: true
region_noop_translation_tol: 0.01
region_noop_yaw_tol: 0.05
region_sample_k: 0
region_sample_restarts: 1
# Mixed finish policy (takes precedence over the two legacy global finish knobs).
region_label_topk: 0
region_exhaust_on_miss_topk: 0
region_finish_topk_cap: 20
region_finish_miss_audit_fraction: 0.20
region_finish_miss_audit_seed: 42

# Goal strategy: R (beast-1-clean) ranks candidate pushes; ml_first orders the frontier by that score.
goal_strategy: scorer
scorer_ckpt: /scratch/dm1487/curriculum2/beast/round2/probe/beast1_clean.ckpt
ml_device: cpu

# 5-DEPTH car primitives -> 60x5 = (4 edges x 15 pts) x 5 depths.
primitive_prefix: "1x_car_d5_"
config_file: config/namo_config_complete_skill15_car_1x.yaml

xml_dir: ${NAMO_DATASETS}/car_envs

verbose: false
filter_minimum_length: false
smooth_solutions: false
refine_actions: false
validate_refinement: false
