# Vector Model (Flow Matching) Evaluation Configuration (2-push, HYBRID)
#
# Hybrid = ML-aligned proposals first, then full primitive fallback.
# This mirrors the 2push branch behavior: goal_strategy=ml_fallback + region_selection_strategy=ml_first.

# Core execution
output_dir: /common/users/tdn39/Robotics/Mujoco/namo_cpp/eval_results/vector_model_2push_hybrid
start_idx: 0
end_idx: 100
algorithm: region_opening
workers: 1
episodes_per_env: 1

# Generic planner limits
max_depth: 5
max_goals_per_object: 5
max_terminal_checks: 5000
search_timeout: 300.0
goals_per_region: 10

# Region opening parameters
region_allow_collisions: true
region_max_chain_depth: 2
region_max_solutions_per_neighbor: 1
region_frontier_beam_width: 5000
region_max_recorded_solutions_per_neighbor: 1
region_selection_strategy: ml_first

# Hybrid goal strategy
goal_strategy: ml_fallback
ml_goal_model: /common/users/tdn39/Robotics/Mujoco/sage_learning/outputs/placeholder
ml_device: cuda
ml_samples: 32
ml_seed: 42
ml_min_goals: 1

# ML->primitive alignment parameters (more permissive for hybrid coverage)
ml_match_position_tolerance: 0.2
ml_match_angle_tolerance: 0.2
ml_match_angle_weight: 1.0
ml_match_score_metric: pos+w*ang
ml_match_max_per_call: 999
ml_k_nearest: 5

# Sampler overrides (flow matching)
ml_sampler_method: euler  # euler, midpoint, rk4, dopri5
ml_num_steps: 20

# Paths
xml_dir: /common/home/dm1487/robotics_research/ktamp/ml4kp_ktamp/resources/models/custom_walled_envs/aug9/medium
config_file: config/namo_config_complete_skill15.yaml
manifest: null

# Options
verbose: true
filter_minimum_length: false
smooth_solutions: false

