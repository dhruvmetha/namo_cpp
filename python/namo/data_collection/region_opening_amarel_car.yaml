# Region-opening data collection config — Amarel + diff-drive car.
# Mirrors region_opening_exhaustive_car.yaml but with Amarel /scratch paths
# and worker count overridden by sbatch at runtime via CLI.

# Core execution (output_dir, workers, start/end overridden by sbatch CLI)
algorithm: region_opening
episodes_per_env: 1

# Generic planner limits
max_depth: 5
max_goals_per_object: 5
max_terminal_checks: 5000
search_timeout: 600.0
# Fraction of goal-region samples that must be reachable for a push to count
# as "opening". Lowered from 0.5 -> 0.2 in line with origin/main commit 9653e29
# ("rejected partial openings that only cleared a corner of the goal region").
# Bumps phase-1 yield without changing what the planner physically tries.

# Region opening parameters — greedy: stop at first solution per neighbor.
points_per_face: 15
region_max_chain_depth: 2
region_max_solutions_per_neighbor: 1
region_max_recorded_solutions_per_neighbor: 1
region_frontier_beam_width: 10000
region_chain_link_cost: 11
region_ml_ignore_blacklist: false
region_selection_strategy: cost_first
region_exhaustive_mode: false

# Goal strategy: pure primitive (no ML)
goal_strategy: primitive
# 1x_car-calibrated 7cm diff-drive primitives. These come from a regen at
# commit 548249a (config namo_config_complete_skill15_car_1x.yaml). Loaded
# via prefix "1x_car_" — symlinks at data/1x_car_motion_primitives_15_*.dat
# point at the canonical data/motion_primitives_1x_car_*.dat files.
primitive_prefix: "1x_car_"

# Robot adapter selection — diff-drive, 1x scale.
# Uses 1cm wavefront resolution + 3.5cm half-extent (matches the primitive-gen
# config); the earlier namo_config_car.yaml used 5cm resolution + 5.2cm extent,
# which mismatched the recalibrated primitives and caused 0% success rates.
config_file: config/namo_config_complete_skill15_car_1x.yaml

# xml_dir is unused when manifest is given. Manifest is passed via sbatch.
xml_dir: ${NAMO_DATASETS}/car_envs

# Pipeline features
verbose: false
filter_minimum_length: false
smooth_solutions: false
refine_actions: false
validate_refinement: false
