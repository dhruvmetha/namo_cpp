# Region-opening data collection config — Amarel + diff-drive car.
# Mirrors region_opening_exhaustive_car.yaml but with Amarel /scratch paths
# and worker count overridden by sbatch at runtime via CLI.

# Core execution (output_dir, workers, start/end overridden by sbatch CLI)
algorithm: region_opening
episodes_per_env: 1

# Generic planner limits
max_depth: 5
max_goals_per_object: 5
max_terminal_checks: 5000
search_timeout: 600.0
goals_per_region: 50
region_min_reachable_fraction: 0.5

# Region opening parameters — greedy: stop at first solution per neighbor.
points_per_face: 15
region_allow_collisions: true
region_max_chain_depth: 2
region_max_solutions_per_neighbor: 1
region_max_recorded_solutions_per_neighbor: 1
region_frontier_beam_width: 10000
region_chain_link_cost: 11
region_ml_ignore_blacklist: false
region_selection_strategy: cost_first
region_exhaustive_mode: false

# Goal strategy: pure primitive (no ML)
goal_strategy: primitive
# Car-calibrated 7cm diff-drive primitives. Without this prefix the planner
# loads the legacy 30cm point-robot primitives and emits targets ~3-4× too far.
primitive_prefix: "car_"

# Robot adapter selection — diff-drive
config_file: config/namo_config_car.yaml

# xml_dir is unused when manifest is given. Manifest is passed via sbatch.
xml_dir: /scratch/dm1487/datasets/car_envs

# Pipeline features
verbose: false
filter_minimum_length: false
smooth_solutions: false
refine_actions: false
validate_refinement: false
