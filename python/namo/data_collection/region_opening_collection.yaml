# YAML defaults for modular_parallel_collection.py (Region Opening)
# Use with: python modular_parallel_collection.py --config-yaml python/namo/data_collection/region_opening_collection.yaml
# CLI flags can override any value here.
# Core execution
output_dir:  /common/users/dm1487/namo_data/jan7/aug9_envs/2_push_test_first_solution #/common/users/dm1487/namo_data/dec25/aug9_envs/1_push_triplets_test_first_solution
# /common/users/dm1487/namo_data/dec2/aug9_envs/2_push_test_first_solution
end_idx: 7000
algorithm: region_opening
workers: 48 
episodes_per_env: 1

# Generic planner limits (not used by region opening, but required for compatibility)
max_depth: 5
max_goals_per_object: 5
max_terminal_checks: 5000
search_timeout: 300.0

# Region opening specific parameters
points_per_face: 15           # 3 or 15 - must match config_file (skill3 or skill15)
region_allow_collisions: true
region_max_chain_depth: 2    # 1=single push, 2=two pushes, 3=three pushes
region_max_solutions_per_neighbor: 1
region_frontier_beam_width: 10000  # null or 0 = unbounded; positive integer caps frontier per depth
region_max_recorded_solutions_per_neighbor: 1
region_chain_link_cost: 11  # Additional cost per chain link beyond first push (0=no extra cost, e.g. 5 makes 2-push cost +5)
region_ml_ignore_blacklist: false  # Allow ML-scored primitives to bypass edge blacklist
region_selection_strategy: cost_first  # Frontier priority: "ml_first" (ML-derived first) or "cost_first" (shallow first)

# Goal strategy: primitive | geometric | ml | ml_fallback | ml_async | ml_driven_async
goal_strategy: primitive

# Primitive strategy options (only used when goal_strategy=primitive)
# shuffle_edges: true  # Randomize edge ordering (useful for difficulty analysis)
# shuffle_seed: 42    # Random seed for reproducible shuffling (null = random each call if shuffle_edges=true)

