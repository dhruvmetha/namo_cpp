## Region Opening + Diffusion Goal Sampler Defaults
## Use with:
##   python sequential_ml_collection.py \
##     --config-yaml python/namo/data_collection/region_opening_ml_collection.yaml
##
## Or via script:
##   CUDA_VISIBLE_DEVICES=2 ./scripts/run_region_opening_ml_sequential.sh \
##     --start-idx 0 --end-idx 100

# Core execution
output_dir: /common/users/dm1487/namo_data/outputs/cropped_diffusion_crossattn_2push/2025-12-16/05-36-44/jan7/results_32samples_int5_seed42_voting1_filtered
start_idx: 0
end_idx: 6000
algorithm: region_opening
workers: 1
episodes_per_env: 1

# Generic planner limits (compatibility placeholders)
max_depth: 5
max_goals_per_object: 5
max_terminal_checks: 5000
search_timeout: 300.0
goals_per_region: 10  # Number of robot goal samples per region for validation

# Region opening parameters
points_per_face: 15           # 3 or 15 - must match config_file (skill3 or skill15)
region_allow_collisions: true
region_max_chain_depth: 2
region_max_solutions_per_neighbor: 1
region_frontier_beam_width: 5000
region_max_recorded_solutions_per_neighbor: 1
region_chain_link_cost: 11  # Additional cost per chain link beyond first push (0=no extra cost, e.g. 5 makes 2-push cost +5)
region_ml_ignore_blacklist: false  # Allow ML-scored primitives to bypass edge blacklist from pre-ML phase
region_selection_strategy: ml_first  # Frontier priority: "ml_first" (prioritize ML-derived states) or "cost_first" (minimize disruption)

# Goal strategy: primitive | geometric | ml | ml_fallback | ml_async | ml_driven_async
goal_strategy: ml
ml_goal_model: /common/users/dm1487/namo_data/outputs/cropped_diffusion_crossattn_2push/2025-12-16/05-36-44
# ml_goal_model: /common/users/dm1487/namo_data/outputs/cropped_diffusion_crossattn_balanced_solutions/2025-12-26/12-32-32
ml_device: cuda  # Use "cuda" (respects CUDA_VISIBLE_DEVICES) or "cuda:0", "cuda:1", etc.
ml_samples: 32  # Increased from 32 for better ML goal coverage
ml_seed: 42   # Random seed for diffusion noise (null = random each time, integer = reproducible)
ml_min_goals: 1
ml_match_position_tolerance: 0.2    # meters - max position error for voting
ml_match_angle_tolerance: 0.2      # radians (~2.9°) - max angle error for voting
ml_match_angle_weight: 1.0
ml_match_max_per_call: 999  # Allow all ML goals to be aligned (was 8)
ml_sampler_method: ddim  # Override sampler: flow_matching=[euler, midpoint, rk4, dopri5], diffusion=[ddpm, ddim] (null = use training config)
ml_num_steps: 5      # Override integration steps (null = use default 20)
ml_k_nearest: 1       # Number of nearest primitive slots to vote for per ML goal (within tolerance). Default: 1
primitive_data_dir: data
preview_aligned_primitives: false  # Save visualization of ML-to-primitive alignment

# Paths
xml_dir: /common/home/dm1487/robotics_research/ktamp/ml4kp_ktamp/resources/models/custom_walled_envs/aug9/medium
config_file: config/namo_config_complete_skill15.yaml
# manifest: /common/users/shared/robot_learning/dm1487/namo/manifests/aug9_medium/manifest.txt  # Pre-generated file list for fast loading (use generate_xml_manifest.py)
manifest: /common/users/shared/robot_learning/dm1487/namo/manifests/aug9_medium/manifest_2push_test_minus_1push_test_filtered.txt # Pre-generated file list for fast loading (use generate_xml_manifest.py)

# Optional pipeline features
verbose: false
filter_minimum_length: false
smooth_solutions: false
max_smooth_actions: 20
refine_actions: false
validate_refinement: false /common/users/dm1487/namo_data/images_local/dec2/aug9_envs/1_push_train_corrected_overlaps

