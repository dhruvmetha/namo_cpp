# FAMILY collection — CAR robot. Capped depth-2 sweep, children stored for ALL tried root pushes.
# [EXP-2026-08-09-crossboard-ranking § collection] Purpose: the missing-children corpus — child
# boards for ordinary failed pushes (~absent from d20: children only ever stored under the 26k
# Colossus setup roots) so the family losses (EG/EGMM/RPE/RPL) train on the impostors deploy meets.
#
# Forked from region_opening_tree_car.yaml (exhaustive). Deltas, each reasoned:
#   region_finish_exhaustive  true -> false   exhaustive costs ~5.6k sims/episode; the family lists
#                                             need verified positives + honest rivals, not proven
#                                             misses. Ranking tolerates censored rivals (measured:
#                                             EXCLUDE_GUESS line, +3pts) — certainty is a luxury.
#   region_finish_topk_cap    0 -> 12         sampled finish sweep; misses are recorded CENSORED
#                                             (finish_sweep_censored), never fake zeros — the honest-
#                                             ignorance labels the rank losses were built for.
#   (kept) stop_after_root_opener: false      the Colossus flag that starved families under opener
#                                             roots — the whole point of this corpus.
# PHYSICS: current post-5daaed5 binary ONLY (set_full_state full-restore). Verify BUILD_INFO before
# launch; this corpus must be single-physics — grafting onto pre-fix rows is banned (card).
algorithm: region_opening
episodes_per_env: 1

# Generic planner limits
max_depth: 5
max_goals_per_object: 5
max_terminal_checks: 5000
search_timeout: 600.0
# Exhaustive sweeps are slower than the capped ones, so the per-neighbour bound is raised. It stays
# FINITE on purpose: a pathological scene must not hog a worker. Anything it truncates is reported as
# censored, never as a proven miss — the one invariant this whole collection exists to protect.
region_timeout_per_neighbour_sec: 1800.0

# Region opening parameters
points_per_face: 15
region_max_chain_depth: 2
region_max_solutions_per_neighbor: 1
region_max_recorded_solutions_per_neighbor: 1
region_frontier_beam_width: 10000
region_chain_link_cost: 11
region_ml_ignore_blacklist: false
region_selection_strategy: ml_first

# --- LABEL block ---
region_label_mode: true
region_exhaustive_mode: true
region_stop_after_root_opener: false
region_record_action_motion: true
# Sweep live child boards to exhaustion too. Without this, label_mode stops at the first verified
# opener, so a live child is recorded as one winning cell with NO negatives — the boards that actually
# contain an opener end up being the ones we know least about, which is precisely the finish-ranking
# training signal (finish@1 has slid 56.1 -> 54.8 -> 52.6 -> 50.8 across the label line). Costs ~2x.
region_finish_exhaustive: false
# Same-object two-push setup must create a new object pose; do not expand slips/no-ops at depth 2.
region_prune_noop_setups: true
region_noop_translation_tol: 0.01
region_noop_yaw_tol: 0.05
region_sample_k: 0
region_sample_restarts: 1
# NO finish cap: every reachable finish is tried, so `finish_sweep_censored` can only be set by the
# per-neighbour timeout above.
region_label_topk: 0
region_exhaust_on_miss_topk: 0
region_finish_topk_cap: 12

# Ordering only — with an exhaustive sweep the scorer changes speed, never the recorded content.
goal_strategy: scorer
scorer_ckpt: $NAMO_SCRATCH/curriculum2/beast/round3/models/d20_plus_setup_only_splitloss/checkpoints/epoch011-val_loss1.6952.ckpt
ml_device: cpu

# 5-DEPTH car primitives -> 60x5 = (4 edges x 15 pts) x 5 depths.
primitive_prefix: "1x_car_d5_"
config_file: config/namo_config_complete_skill15_car_1x.yaml

xml_dir: ${NAMO_DATASETS}/car_envs

verbose: false
filter_minimum_length: false
smooth_solutions: false
refine_actions: false
validate_refinement: false
